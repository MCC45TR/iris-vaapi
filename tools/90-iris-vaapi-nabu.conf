# Select the Nabu Iris VA-API driver for graphical sessions.  The DRM driver
# is named msm, so libva cannot infer the out-of-tree iris driver name.
LIBVA_DRIVER_NAME=iris
# GStreamer cannot identify this experimental libva vendor string yet.  Allow
# its generic VA plugin to expose only the profiles the driver advertises.
GST_VA_ALL_DRIVERS=1
